name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site
          mkdir -p _site/web_demo
          cp -R web_demo/* _site/web_demo/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="ru">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=web_demo/">
            <title>Personal VPN Control Plane MVP</title>
          </head>
          <body>
            <a href="web_demo/">Open demo</a>
          </body>
          </html>
          HTML
          mkdir -p _site/docs
          cp docs/vpn_service_tz.pdf _site/docs/
          cp docs/vpn_service_tz.md _site/docs/
          cp docs/api/openapi.yaml _site/docs/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
